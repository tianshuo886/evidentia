name: One-time repository history compaction

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PURGE-READER-V3-RUNS-AND-EVALS to rewrite repository history
        required: true
        type: string

permissions:
  contents: write

jobs:
  purge:
    if: ${{ inputs.confirm == 'PURGE-READER-V3-RUNS-AND-EVALS' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record pre-purge size
        run: |
          du -sh reader-v3-runs evals || true
          git count-objects -vH

      - name: Install git-filter-repo
        run: python -m pip install git-filter-repo

      - name: Remove run outputs and paper-specific evaluation archives from every commit
        run: |
          git filter-repo --force \
            --path reader-v3-runs/ \
            --path evals/ \
            --invert-paths

      - name: Prove large paths are absent from rewritten history
        run: |
          REWRITTEN_REFS=$(git for-each-ref --format='%(refname)' refs/heads refs/tags)
          if git log $REWRITTEN_REFS --name-only --format= | grep -E '^(reader-v3-runs/|evals/)' >/tmp/forbidden_paths; then
            cat /tmp/forbidden_paths
            echo 'Removed paths are still reachable in history' >&2
            exit 1
          else
            echo 'No removed paths are reachable from rewritten branches or tags.'
          fi
          # Production source and synthetic test assets must survive; all
          # historical run outputs may disappear.
          test -f tests/test_equation_fidelity.py
          test -f scripts/reader_acceptance.py
          test -f scripts/release_gate.py
          du -sh .
          git count-objects -vH

      - name: Restore origin after git-filter-repo
        run: git remote add origin https://github.com/${GITHUB_REPOSITORY}.git

      - name: Force-push rewritten branches and tags
        run: |
          git push origin --force --all
          git push origin --force --tags

      - name: Remove the one-time purge workflow from the rewritten repository
        run: |
          git rm .github/workflows/purge-heavy-history.yml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: remove one-time history purge workflow'
          git push origin HEAD:master
